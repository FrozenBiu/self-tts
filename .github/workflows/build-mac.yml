name: Build macOS Application (.dmg)

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub bất kỳ lúc nào
  push:
    tags:
      - 'v*' # Tự động chạy khi tạo tag release như v1.0.0

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build macOS (.dmg & .zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          pnpm run desktop:build:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniVoice-Studio-macOS
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 14

      - name: Create GitHub Release (nếu có tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
