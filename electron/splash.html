<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Khởi động OmniVoice Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background: #080c14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      position: relative;
      -webkit-app-region: drag;
    }

    /* Gradient glow background */
    .glow-bg {
      position: absolute;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(168, 85, 247, 0.15) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(40px);
    }

    .card {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .icon-box {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(168, 85, 247, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.5);
      margin-bottom: 18px;
      animation: pulse 2.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.5); }
      50% { transform: scale(1.05); box-shadow: 0 14px 40px -8px rgba(168, 85, 247, 0.7); }
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      margin-bottom: 24px;
      display: inline-block;
    }

    /* Progress bar */
    .progress-bar-container {
      width: 280px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 14px;
      position: relative;
    }

    .progress-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 9999px;
      position: absolute;
      animation: loading 1.8s infinite ease-in-out;
    }

    @keyframes loading {
      0% { left: -40%; width: 30%; }
      50% { left: 40%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }

    .status-text {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .dots {
      display: inline-block;
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: ""; }
      40% { content: "."; }
      60% { content: ".."; }
      80%, 100% { content: "..."; }
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  <div class="card">
    <div class="icon-box">🎙️</div>
    <h1>OmniVoice Studio</h1>
    <span class="badge">Text-to-Speech 24kHz • Tiếng Việt</span>

    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>

    <div class="status-text" id="status">
      Đang khởi động hệ thống và nạp AI Backend...
    </div>
  </div>

  <script>
    const messages = [
      "Đang khởi động hệ thống...",
      "Đang nạp Backend AI và kết nối Cloud GPU...",
      "Đang tối ưu bộ đệm âm thanh...",
      "Sắp hoàn tất, đang chuẩn bị giao diện..."
    ];
    let idx = 0;
    const statusEl = document.getElementById("status");
    setInterval(() => {
      idx = (idx + 1) % messages.length;
      statusEl.style.opacity = 0;
      setTimeout(() => {
        statusEl.innerText = messages[idx];
        statusEl.style.opacity = 1;
      }, 300);
    }, 2500);
  </script>
</body>
</html>
